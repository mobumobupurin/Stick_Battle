<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b27"><title>STICK WORLD | GAME HUB</title><link rel="stylesheet" href="world.css"></head><body>
<header><a class="back" href="../">← GAME HUB / 本編</a><div class="brand"><small>STICK BATTLE ONLINE / AMUSEMENT</small><h1>STICK WORLD<span>.</span></h1></div><div class="wallet"><small>手持ち / BANK</small><strong id="wallet">—</strong></div></header>
<main><section class="intro"><div><b id="modeLabel">練習版・端末内保存</b><p id="status" aria-live="polite">架空コイン専用。オンラインにはFirebase認証・データベース設定が必要です。</p></div><div class="auth"><input id="email" type="email" placeholder="メールアドレス" autocomplete="email"><input id="password" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password"><button id="login" disabled>オンラインログイン</button><button id="signup" disabled>新規登録</button><button id="logout" hidden>ログアウト</button></div></section>
